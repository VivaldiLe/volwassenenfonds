<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f4f0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>NEURO PIANO — tijdelijk offline</title>
  <style>
    :root{
      --ink:#201d26;
      --paper:#f7f4f0;
      --muted:#77717c;
      --line:rgba(32,29,38,.14);
      --serif:"Iowan Old Style","Baskerville","Times New Roman",serif;
      --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      color:var(--ink);
      font-family:var(--sans);
      background:
        radial-gradient(circle at 24% 20%, rgba(197,181,215,.32), transparent 30rem),
        radial-gradient(circle at 78% 66%, rgba(191,213,220,.30), transparent 28rem),
        var(--paper);
      overflow:hidden;
    }
    body:before,body:after{
      content:"";
      position:fixed;
      width:min(72vw,760px);
      aspect-ratio:1;
      border:1px solid rgba(255,255,255,.78);
      border-radius:50%;
      transform:scaleY(.33) rotate(24deg);
      filter:blur(.2px);
      opacity:.7;
      pointer-events:none;
    }
    body:after{transform:scaleY(.22) rotate(-31deg);width:min(86vw,900px);opacity:.45}
    main{
      position:relative;
      z-index:1;
      width:min(760px,100%);
      text-align:center;
      padding:54px 34px;
      border:1px solid rgba(255,255,255,.78);
      border-radius:30px;
      background:rgba(255,255,255,.48);
      backdrop-filter:blur(18px);
      box-shadow:0 24px 70px rgba(44,35,51,.08);
    }
    .eyebrow{
      font-size:.72rem;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
      margin-bottom:18px;
    }
    h1{
      margin:0 0 20px;
      font-family:var(--serif);
      font-size:clamp(3.2rem,9vw,7.2rem);
      line-height:.88;
      font-weight:400;
      letter-spacing:-.04em;
    }
    p{
      margin:0 auto;
      max-width:520px;
      color:var(--muted);
      font-size:1rem;
      line-height:1.6;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">NEURO PIANO · Lena Sloss</div>
    <h1>Tijdelijk offline.</h1>
    <p>De website wordt momenteel bijgewerkt en is binnenkort weer beschikbaar.</p>
  </main>
</body>
</html>
